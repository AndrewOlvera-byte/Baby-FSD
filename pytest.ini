[pytest]
# Pytest configuration for Baby-FSD

# Add project root and pipeline to Python path so tests can import modules
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --color=yes

# Test paths
testpaths = tests

# Ignore certain directories
norecursedirs =
    .git
    __pycache__
    outputs
    data
    pipeline/outputs

