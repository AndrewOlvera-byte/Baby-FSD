# Reusable base settings (DRY via anchors)
x-trainer-common: &trainer-common
  build:
    context: ../..
    dockerfile: pipeline/docker/Dockerfile
    args:
      BASE_IMAGE: ${BASE_IMAGE-}   # optional override at build time
  image: rlds-trainer:latest
  working_dir: /app
  # Enable GPU in local docker compose (not swarm)
  gpus: all
  deploy:
    resources:
      reservations:
        devices:
          - capabilities: ["gpu"]
  # local Docker (not Swarm) can also use: gpus: all
  volumes:
    - ../../:/app
    - ../../pipeline/outputs:/app/pipeline/outputs
  shm_size: 8gb            # Large shared memory for PyTorch multiprocessing with YOLO
  environment:
    - PYTHONPATH=/app:/app/pipeline
    - MUJOCO_GL=egl
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}

services:

  # TRAIN service (default)
  trainer:
    <<: *trainer-common
    # Default runs your selected exp from config/defaults.yaml
    command: ["python", "pipeline/scripts/train.py"]

  search:
    <<: *trainer-common
    profiles: ["search"]
    command: ["python", "pipeline/scripts/search.py", "-m", "+hpo=optuna", "+hpo.space=ppo_basic"]

  eval:
    <<: *trainer-common
    profiles: ["eval"]
    command: ["python", "pipeline/scripts/eval.py"]