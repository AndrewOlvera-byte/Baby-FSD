name: carla_eval

# CARLA server connection (debug-friendly)
host: "10.0.0.121"
port: 2000
tm_port: 8000

# Evaluation settings (small for smoke test)
n_episodes: 1
episode_max_steps: 600  # shorter loop for quick verification

# Video recording
save_video: true
video_fps: 20

# Simulation environment
town: "Town10HD_Opt"
weather: 0
npc_count: 0  # no NPCs for deterministic debug

# Model checkpoint (override from CLI if needed)
checkpoint_path: "/home/drewo/projects/Baby-FSD/outputs/bc_train_debug/train/20251123_222336/reports/checkpoints/step_1.pt"

# Camera settings for mp4
camera_width: 800
camera_height: 600
camera_fov: 90
spectator_height: 8.0
spectator_follow: true
spectator_back: 8.0

# Simple controller params
controller:
  steer_kp: 1.5
  steer_kd: 0.05
  throttle_kp: 0.5
  throttle_kd: 0.1
  brake_kp: 0.3
  lookahead_idx: 2
  target_speed_mps: null  # use model prediction if null
  steer_smoothing: 0.5
  speed_smoothing: 0.7
  min_target_speed_mps: 0.0

# Optional: route/goal settings
max_route_distance: 150.0

# BEV / perception settings
bev:
  meters_x: 80.0
  meters_y: 60.0
  resolution_m: 0.4
  lane_width_m: 3.5
  route_corridor_width_m: 6.0
  centerline_thickness_m: 0.6
  drivable_thickness_m: 6.0
  actor_radius_m: 1.2

actor_radius: 40.0
window_m: 60.0
