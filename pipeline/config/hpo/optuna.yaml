hydra:
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: null              
    study_name: "${exp.name}"
    n_trials: 20
    n_jobs: 1
    direction: ${hpo.direction}  
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${seed.seed}
      multivariate: true
    pruner:
      _target_: optuna.pruners.MedianPruner
      n_startup_trials: 5
      n_warmup_steps: 0
    params: ${hpo.params}

hpo:
  direction: "maximize"        
  params: {}                   
  objective_key: ""            
