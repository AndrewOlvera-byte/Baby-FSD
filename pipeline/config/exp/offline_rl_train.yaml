name: offline_rl_train
desc: "Offline RL training using IQL"
tags: ["offline_rl", "iql", "carla"]

trainer:
  name: offline_rl
  algorithm: iql  # Options: iql, cql, td3bc
  batch_size: 128
  gradient_accumulation_steps: 1
  epochs: 50

  # RL hyperparameters
  gamma: 0.99  # Discount factor
  tau: 0.005  # Target network soft update rate

  # IQL-specific hyperparameters
  expectile: 0.7  # IQL expectile (0.5-0.9, higher = more conservative)
  temperature: 3.0  # IQL temperature for advantage weighting

  # CQL-specific (uncomment if using algorithm: cql)
  # cql_alpha: 1.0  # CQL conservative penalty weight

  # TD3+BC-specific (uncomment if using algorithm: td3bc)
  # bc_alpha: 2.5  # Behavior cloning regularization weight

  max_grad_norm: 1.0
  use_ema: true
  ema_decay: 0.9999

  early_stopping:
    enabled: true
    patience: 10  # Longer patience for RL
    min_delta: 0.001

  loader:
    # WebLoader pattern: workers yield samples, main process batches
    num_workers: 8
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
    shuffle_buffer_size: 5000  # Per-worker shuffle buffer

  optimizer:
    name: adamw
    lr: 3.0e-4  # Lower LR for RL (more stable)
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

  lr_scheduler:
    name: cosine
    warmup: 500  # Longer warmup for RL stability

dataset:
  run_dir: "data/RL_v1/run-20251130-120000"
  future_horizon: 12
  route_points: 32
  max_objects: 64
  val_ratio: 0.2

# Actor-critic model (requires separate actor and critic networks)
# Note: You'll need to create these model configs
model:
  actor:
    name: rl_actor
  critic:
    name: rl_critic

augmentation:
  enabled: true
  p_rot: 0.3  # Lower rotation for RL (preserve action validity)
  max_rot_deg: 15.0
  p_bev_cutout: 0.15
  p_bev_channel_drop: 0.1

speed:
  channels_last: true
  cudnn_benchmark: true

logger:
  log_interval: 100
  backend: tensorboard  # or wandb
