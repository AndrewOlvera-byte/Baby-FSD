name: bc_train_70k
desc: "BC training with proper regularization for 70K samples"
tags: ["bc", "carla", "tiny", "70k"]

trainer:
  name: bc
  batch_size: 128
  gradient_accumulation_steps: 1
  epochs: 100              # More epochs with early stopping

  # Loss configuration
  loss_waypoint_weight: 1.0
  loss_speed_weight: 0.5
  horizon_decay: 0.03

  # Modality dropout for regularization
  drop_bev_p: 0.15         # Increased from 0.1
  drop_objects_p: 0.15     # Increased from 0.1

  max_grad_norm: 1.0

  # EMA with faster decay for small dataset
  use_ema: true
  ema_decay: 0.998         # Faster than 0.999 for 70K samples

  # Early stopping - critical for overfitting
  early_stopping:
    enabled: true
    patience: 10           # Increased patience
    min_delta: 0.0005      # Larger delta to avoid stopping on noise
    monitor: "valid/loss"

  loader:
    num_workers: 8         # Reduced - too many workers causes contention
    prefetch_factor: 16    # MUCH larger buffer: 8×16 = 128 samples prefetched
    persistent_workers: true
    pin_memory: true
    shuffle_buffer_size: 1000  # Reduced - large shuffle slows workers

  optimizer:
    name: adamw
    lr: 1.0e-3             # Higher initial LR (was 3e-4)
    weight_decay: 0.1      # Strong regularization (was 0.05)
    betas: [0.9, 0.95]
    eps: 1.0e-8

  lr_scheduler:
    name: cosine
    warmup: 2000           # ~5 epochs warmup (437 steps/epoch × 100 epochs = 43,700 total)
                           # 2000/43700 = 4.6% of training for warmup

dataset:
  run_dir: "data/BC_v2/run-20251125-040239-sparse-shards-wds"
  future_horizon: 12
  route_points: 32
  max_objects: 64
  val_ratio: 0.2

  # Data diversity validation
  diversity:
    enabled: true
    min_speed_std: 1.5      # Slightly relaxed (was 2.0)
    min_steer_std: 0.05     # Relaxed (was 0.1)
    min_moving_ratio: 0.6   # Relaxed (was 0.7)
    max_stationary_ratio: 0.3  # Relaxed (was 0.25)
    warn_on_fail: true

model:
  name: bc_policy
  # Use tiny model config (~500K params)
  d_model: 96
  n_heads: 3
  n_layers: 2
  dropout: 0.3             # High dropout for regularization
  patch_size: [12, 12]     # Larger patches → fewer tokens
  ego_hidden: 48
  route_hidden: 48
  object_hidden: 48
  n_object_types: 4
  n_future_steps: 12

# Strong augmentation to combat overfitting
augmentation:
  enabled: true
  # GPU augmentations (heavy ops)
  p_rot: 0.7               # Increased from 0.5
  max_rot_deg: 20.0        # Increased from 15.0
  p_bev_cutout: 0.3        # Increased from 0.25
  p_bev_channel_drop: 0.2  # Increased from 0.15
  # CPU augmentations (lightweight ops)
  p_drop_bev: 0.1
  p_drop_objects: 0.1
  p_ego_noise: 0.3         # Increased from 0.2
  ego_noise_scale: 0.05    # Increased from 0.03
  p_speed_scale: 0.3       # Increased from 0.2
  speed_scale_range: [0.7, 1.3]  # Wider range
  p_trajectory_noise: 0.4  # Increased from 0.3
  trajectory_noise_std: 0.03  # Increased from 0.02
  p_lateral_shift: 0.3     # Increased from 0.2
  max_lateral_shift: 0.08  # Increased from 0.05
