name: bc_train_70k
desc: "BC training with proper regularization for 70K samples"
tags: ["bc", "carla", "tiny", "70k"]

trainer:
  name: bc
  batch_size: 128
  gradient_accumulation_steps: 1
  epochs: 100              

  loss_waypoint_weight: 1.0
  loss_speed_weight: 0.5
  horizon_decay: 0.03

  drop_bev_p: 0.15         
  drop_objects_p: 0.15     

  max_grad_norm: 1.0

  use_ema: true
  ema_decay: 0.998        


  early_stopping:
    enabled: true
    patience: 10           
    min_delta: 0.0005      
    monitor: "valid/loss"

  loader:
    num_workers: 8         
    prefetch_factor: 16    
    persistent_workers: true
    pin_memory: true
    shuffle_buffer_size: 1000  

  optimizer:
    name: adamw
    lr: 1.0e-3             
    weight_decay: 0.1      
    betas: [0.9, 0.95]
    eps: 1.0e-8
    fused: true            

  lr_scheduler:
    name: cosine
    warmup: 2000           

dataset:
  run_dir: "data/BC_v3/run-20251202-041506-wds"
  future_horizon: 12
  route_points: 32
  max_objects: 64
  val_ratio: 0.2

  diversity:
    enabled: true
    min_speed_std: 1.5      
    min_steer_std: 0.05     
    min_moving_ratio: 0.6   
    max_stationary_ratio: 0.3 
    warn_on_fail: true

model:
  name: bc_policy
  d_model: 96
  n_heads: 3
  n_layers: 2
  dropout: 0.3             
  patch_size: [12, 12]     
  ego_hidden: 48
  route_hidden: 48
  object_hidden: 48
  n_object_types: 4
  n_future_steps: 12

augmentation:
  enabled: true
  enable_rotation: false   
  p_rot: 0.0               
  max_rot_deg: 20.0        
  p_bev_cutout: 0.3        
  p_bev_channel_drop: 0.2  
  p_drop_bev: 0.1
  p_drop_objects: 0.1
  p_ego_noise: 0.3         
  ego_noise_scale: 0.05    
  p_speed_scale: 0.3       
  speed_scale_range: [0.7, 1.3] 
  p_trajectory_noise: 0.4  
  trajectory_noise_std: 0.03 
  p_lateral_shift: 0.3     
  max_lateral_shift: 0.08  
