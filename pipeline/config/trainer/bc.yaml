name: bc
batch_size: 256
epochs: 50

optimizer:
  name: adamw
  lr: 6.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  eps: 1.0e-8
  fused: false  # Enable fused AdamW for better performance (PyTorch >= 2.0)

lr_scheduler:
  name: cosine
  warmup: 4000

max_grad_norm: 1.0

# Gradient accumulation for larger effective batch size
gradient_accumulation_steps: 1  # Effective batch = 256

# EMA (Exponential Moving Average) for stability and better final performance
use_ema: true
ema_decay: 0.9999

loader:
  # High-throughput settings to prevent GPU starvation
  num_workers: 12  # Increased from 8 for more parallel loading
  prefetch_factor: 6  # Increased from 2: each worker buffers 6 samples
  persistent_workers: true  # Keep workers alive between epochs
  pin_memory: true  # Fast GPU transfer
  shuffle_buffer_size: 5000  # Per-worker shuffle buffer

# Loss weights and horizon emphasis
loss_waypoint_weight: 1.0
loss_speed_weight: 0.2
horizon_decay: 0.05

# Modality dropout
drop_bev_p: 0.05
drop_objects_p: 0.05

# Early stopping configuration
early_stopping:
  enabled: false
  patience: 7
  min_delta: 0.0001
  monitor: "valid/loss"