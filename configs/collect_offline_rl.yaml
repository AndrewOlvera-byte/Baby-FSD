host: ""
port: 2000
tm_port: 8000

out_dir: "data/RL_v1"

fixed_dt: 0.05         
future_dt: 0.2         

K: 32                  
N: 12                  

actor_radius: 40.0
window_m: 60.0

no_rendering: false
shard_rows: 1000
max_frames: 550000

behavior: "normal"     # cautious | normal | aggressive
wheelbase_m: 2.875

episodes: 1
episode_max_frames: 2750
npc_count: 40

spectator_follow: true
spectator_mode: "chase"

bev:
  meters_x: 80.0
  meters_y: 60.0
  resolution_m: 0.4
  lane_width_m: 3.5
  route_corridor_width_m: 6.0
  centerline_thickness_m: 0.6
  drivable_thickness_m: 6.0
  actor_radius_m: 1.2

rewards:
  progress_weight: 0.1
  collision_penalty: -5.0
  offroad_penalty: -2.0
  violation_penalty: -1.0
  comfort_weight: -0.01
  completion_bonus: 5.0
  clip_min: -10.0
  clip_max: 10.0
  max_stopline_dist: 8.0

noise:
  probability: 0.2
  steer_std: 0.1
  throttle_std: 0.05
  brake_std: 0.05

termination:
  collision: true
  offroad: true
  completion: true
  completion_goal_dist: 5.0

validation:
  max_speed_mps: 50.0
  max_abs_accel_mps2: 12.0
  min_route_cov: 0.6
  require_bev_per_frame: true
  require_futures_per_frame: true
  require_objects_per_actor: true

storage:
  backend: hdf5
  episodes_per_set: 5
  compression: lz4
  chunk_size: 100
