# Connection
host: "127.0.0.1"
port: 2000
tm_port: 8000

# Output
out_dir: "data/BC_v1"

# Sim timing
fixed_dt: 0.05         # 20 Hz
future_dt: 0.2         # label spacing

# Labels / tokens
K: 32                  # route points ahead (ego frame)
N: 12                   # future waypoints/vels

# Extraction windows (reduced for speed)
actor_radius: 40.0      # 40m still covers ~3s at highway speeds
window_m: 60.0          # 60m map window

# Performance
no_rendering: false     # Disabled for maximum throughput
shard_rows: 1000
max_frames: 30000

# Agent behavior
behavior: "normal"     # cautious | normal | aggressive
wheelbase_m: 2.875

# Episodes and traffic
episodes: 20
episode_max_frames: 2000
npc_count: 40

# Visual debug
spectator_follow: true    # Disabled for maximum throughput
spectator_mode: "chase"    # "fpv" or "chase"

# BEV configuration
bev:
  meters_x: 80.0         # forward/back extent (x) - reduced for speed
  meters_y: 60.0         # left/right extent (y) - reduced for speed
  resolution_m: 0.4      # meters per pixel - reduced for speed (~4x fewer pixels)
  lane_width_m: 3.5
  route_corridor_width_m: 6.0
  centerline_thickness_m: 0.6    # scaled with resolution
  drivable_thickness_m: 6.0      # scaled with resolution
  actor_radius_m: 1.2            # scaled with resolution

# Validation thresholds (sanity checks)
validation:
  max_speed_mps: 50.0
  max_abs_accel_mps2: 12.0
  min_route_cov: 0.6
  require_bev_per_frame: true
  require_futures_per_frame: true
  require_objects_per_actor: true

# Parquet storage
parquet:
  compression: snappy   # Much faster than gzip, similar compression ratio

# Storage backend
storage:
  backend: parquet_dataset  # parquet_dataset (simple, robust) | duckdb (faster but complex)

