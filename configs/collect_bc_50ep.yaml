# Collection config for 50 episodes with improved stopping frame handling
# Based on literature: ~10-20% stationary frames is healthy for learning to stop

# Connection
host: "10.0.0.121"
port: 2000
tm_port: 8000

# Output
out_dir: "data/BC_v2"

# Sim timing
fixed_dt: 0.1          # 10 Hz
future_dt: 0.2         # label spacing

# Labels / tokens
K: 32                  # route points ahead (ego frame)
N: 12                  # future waypoints/vels

# Extraction windows
actor_radius: 40.0     # 40m covers ~3s at highway speeds
window_m: 60.0         # 60m map window

# Performance
no_rendering: true
shard_rows: 1000
max_frames: 550000

# Defaults / fallbacks
speed_limit_default_mps: 13.9   # 13.9 m/s ~= 50 km/h

# Agent behavior
behavior: "normal"     # cautious | normal | aggressive
wheelbase_m: 2.875

# Episodes and traffic (50 episodes for better coverage)
episodes: 50
episode_max_frames: 2750
npc_count: 50          # More traffic for diverse scenarios

# Visual debug
spectator_follow: false
spectator_mode: "chase"

# BEV configuration
bev:
  meters_x: 80.0
  meters_y: 60.0
  resolution_m: 0.4
  lane_width_m: 3.5
  route_corridor_width_m: 6.0
  centerline_thickness_m: 0.6
  drivable_thickness_m: 6.0
  actor_radius_m: 1.2

# Validation thresholds
validation:
  max_speed_mps: 50.0
  max_abs_accel_mps2: 12.0
  min_route_cov: 0.6
  require_bev_per_frame: true
  require_futures_per_frame: true
  require_objects_per_actor: true

# Parquet storage
parquet:
  compression: snappy

# Storage backend
storage:
  backend: hdf5
  episodes_per_set: 5
  compression: lz4
  chunk_size: 100

# Stopping frame configuration
# Literature suggests 10-20% stationary frames helps learn braking behavior
# Too few: model never learns to stop
# Too many: model learns to always stop (your current issue!)
stopping:
  # Keep some stationary frames (controlled rate)
  keep_stationary_ratio: 0.15    # Keep 15% of stationary frames
  # Minimum speed to be considered "moving"
  min_speed_mps: 0.3
  # Maximum consecutive stationary frames to keep
  max_consecutive_stationary: 5
  # Always keep frames near traffic lights (learning to stop at lights)
  keep_near_traffic_light: true
  traffic_light_radius_m: 15.0

