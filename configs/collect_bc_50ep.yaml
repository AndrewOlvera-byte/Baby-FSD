host: "10.0.0.121"
port: 2000
tm_port: 8000

out_dir: "data/BC_v2"

fixed_dt: 0.1          
future_dt: 0.2         

K: 32                  
N: 12                  

actor_radius: 40.0     
window_m: 60.0         

no_rendering: true
shard_rows: 1000
max_frames: 550000

speed_limit_default_mps: 13.9   
force_speed_limit_mps: 50.0

behavior: "normal"     
wheelbase_m: 2.875

episodes: 50
episode_max_frames: 2750
npc_count: 50          

spectator_follow: false
spectator_mode: "chase"

bev:
  meters_x: 80.0
  meters_y: 60.0
  resolution_m: 0.4
  lane_width_m: 3.5
  route_corridor_width_m: 6.0
  centerline_thickness_m: 0.6
  drivable_thickness_m: 6.0
  actor_radius_m: 1.2

validation:
  max_speed_mps: 50.0
  max_abs_accel_mps2: 12.0
  min_route_cov: 0.6
  require_bev_per_frame: true
  require_futures_per_frame: true
  require_objects_per_actor: true

parquet:
  compression: snappy

storage:
  backend: hdf5
  episodes_per_set: 5
  compression: lz4
  chunk_size: 100

stopping:
  keep_stationary_ratio: 0.6     
  min_speed_mps: 0.3
  max_consecutive_stationary: 30
  keep_near_traffic_light: true
  traffic_light_radius_m: 15.0

